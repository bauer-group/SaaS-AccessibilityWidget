# =============================================================================
# Dependabot Maintenance - SaaS-AccessibilityWidget
# =============================================================================
# Merges Dependabot PRs once the PR CI that builds and tests them has passed,
# using the reusable workflow from bauer-group/automation-templates
# (docs/workflows/docker-maintenance.md).
#
# Trigger scope: no `paths:` filter, so every Dependabot PR - whatever its
# ecosystem - gets an explicit decision (merged, or left open with an
# annotation and a job summary) instead of silently staying open.
# - npm (pnpm workspace): Dependabot changes package.json files and
#   pnpm-lock.yaml. nodejs-pr.yml runs on every pull request to main (no
#   paths: filter): pnpm install --frozen-lockfile, lint, format check,
#   typecheck, build, tests and the bundle size check - that run must
#   pass. The CLA check passes for Dependabot.
# - GitHub Actions updates and any other PR that changes .github/ are never
#   merged automatically (guard of the reusable workflow) - merge by hand.
#
# Update types: patch and minor are merged (default merge-update-types),
# majors stay open for review. Below 1.0.0 a minor (0.y.z) or 0.0.z patch
# update counts as major, and a grouped PR counts as its strictest update,
# so dependabot.yml keeps 0.x packages out of the minor/patch group.
#
# No release-workflow: dependency updates use chore(deps) and publish
# nothing. The merge (GITHUB_TOKEN) starts no push workflow, so neither
# nodejs-release.yml nor the CDN/Pages deploys it triggers run for it.
# All dependencies are devDependencies, but the widget is bundled: the
# build toolchain (typescript, tsx, esbuild) produces the bundle that the
# next feat/fix release publishes and deploy-cdn.yml rolls out to customer
# sites. nodejs-pr.yml builds, tests and size-checks that bundle on the PR.
#
# Timeouts: the reusable workflow sets its own (75 min without
# release-workflow); a job that calls a reusable workflow cannot declare
# timeout-minutes.
# =============================================================================

name: 🤖 Dependabot Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# The reusable workflow declares no permissions of its own - the token has
# exactly these. The three read scopes are needed in private repositories and
# keep the workflow working should this repository ever be made private.
permissions:
  contents: write # merge
  pull-requests: write # approve, read the PR
  checks: read # check runs and suites
  statuses: read # commit statuses
  actions: read # workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      # The PR CI that builds and tests the update; a PR it did not run for
      # stays open as "not tested".
      required-workflows: .github/workflows/nodejs-pr.yml
      merge-method: 'squash'
      auto-approve: true
    secrets: inherit
