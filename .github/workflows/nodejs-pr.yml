# =============================================================================
# Node.js PR Validation Workflow
# =============================================================================
# Lint, typecheck, build (+ size budget), test and audit on PRs to main, via
# the shared bauer-group/automation-templates reusable.
#
# cache-dependencies: false — the reusable runs setup-node with `cache: pnpm`
# BEFORE installing pnpm, which only works when the package manager is
# preinstalled (npm). pnpm isn't on the runner yet at that point, so the cache
# step would fail; disabling the node-level cache avoids it (pnpm is installed
# by the reusable's own Setup pnpm step right after).
# =============================================================================

name: 🔍 PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: 🧪 Build & Test
    uses: bauer-group/automation-templates/.github/workflows/nodejs-build.yml@main
    with:
      node-version-file: '.nvmrc'
      package-manager: 'pnpm'
      package-manager-version: '10'
      cache-dependencies: false
      frozen-lockfile: true
      run-lint: true
      lint-command: 'pnpm typecheck && pnpm lint'
      build-command: 'pnpm build && pnpm --filter @bauer-group/accessibility-widget size'
      run-tests: true
      test-command: 'pnpm test'
      run-audit: true
      audit-level: 'high'
      audit-production-only: true
      upload-artifacts: false
    secrets: inherit
