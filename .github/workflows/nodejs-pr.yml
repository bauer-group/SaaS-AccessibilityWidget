# =============================================================================
# Node.js PR Validation Workflow
# =============================================================================
# Lint, typecheck, build, test, size budget and a (non-blocking) audit on PRs
# to main. Self-contained rather than the reusable nodejs-build.yml, which sets
# up `setup-node` with `cache: pnpm` BEFORE installing pnpm (fails on pnpm
# repos). Correct order here: pnpm → node(cache) → install.
# =============================================================================

name: 🔍 PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate (lint · typecheck · build · test · size)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Lint
        run: pnpm lint

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🏗️ Build
        run: pnpm build

      - name: 🧪 Test
        run: pnpm test

      - name: 📏 Widget size budget
        run: pnpm --filter @bauer-group/accessibility-widget size

      - name: 🔒 Security audit (non-blocking)
        run: pnpm audit --audit-level high || true
