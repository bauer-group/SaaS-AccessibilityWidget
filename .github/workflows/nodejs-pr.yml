# =============================================================================
# Node.js PR Validation Workflow
# =============================================================================
# Self-hosted (not the reusable nodejs-build.yml) — that reusable runs
# pnpm/action-setup with a `version`, which hard-errors when the package.json
# `packageManager` field is present. But Turborepo REQUIRES `packageManager`,
# so the two are mutually exclusive for a pnpm + turbo repo. (npm repos never
# hit this: npm is preinstalled, so action-setup never runs.) Setting up pnpm
# WITHOUT a version reads `packageManager` cleanly — no conflict, turbo happy.
# =============================================================================

name: 🔍 PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6 # no version → reads packageManager

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Lint
        run: pnpm lint

      - name: 💅 Format check
        run: pnpm format:check

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🏗️ Build
        run: pnpm build

      - name: 🧪 Test
        run: pnpm test

      - name: 📏 Widget size budget
        run: pnpm --filter @bauer-group/accessibility-widget size
