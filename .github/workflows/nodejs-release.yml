# =============================================================================
# Release & NPM Publish Workflow
# =============================================================================
# Builds + tests, runs semantic-release (conventional commits → version bump,
# CHANGELOG, git tag, GitHub release) and publishes the CORE package
# @bauer-group/accessibility-widget to npm. The 7 framework wrappers are NOT
# published here — they move to a dedicated integrations repo (Step 2).
#
# semantic-release is configured (.github/config/release/semantic-release.json)
# with pkgRoot: packages/widget and npmPublish: false — it bumps + commits
# packages/widget/package.json and cuts the vX.Y.Z tag. The actual npm publish
# runs in the publish-npm job below, TOKENLESS via OIDC Trusted Publishing
# (see docs/npm-publishing.md). The first-ever publish is a one-time local
# bootstrap (`pnpm publish:bootstrap`) — npm only enables Trusted Publishing
# for a package that already exists.
#
# test-and-build is self-contained (not the reusable nodejs-build.yml, which
# sets up node's pnpm cache before installing pnpm and fails on pnpm repos).
#
# The CDN deploy (deploy-cdn.yml) keys off THIS workflow completing.
# =============================================================================

name: 🚀 Release & NPM Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test-and-build:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Lint
        run: pnpm lint

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🏗️ Build
        run: pnpm build

      - name: 🧪 Test
        run: pnpm test

  release:
    name: 📦 Create Semantic Release
    needs: [test-and-build]
    if: needs.test-and-build.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
      extra-plugins: '@semantic-release/npm'
    secrets: inherit

  publish-npm:
    name: 📤 Publish core to npm (OIDC)
    needs: release
    if: needs.release.outputs.release-created == 'true'
    # OIDC Trusted Publishing — tokenless. A publish hiccup stays a visible red
    # job but must NOT block the CDN deploy (deploy-cdn.yml keys off this
    # workflow's overall success).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔖 Sync released version
        # The release commit semantic-release pushed isn't this job's checkout,
        # so set packages/widget/package.json to the released version explicitly.
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: packages/widget

      - name: 🏗️ Build at released version
        run: pnpm --filter @bauer-group/accessibility-widget build

      - name: 📤 Publish @bauer-group/accessibility-widget
        # OIDC (id-token: write) authenticates — no NODE_AUTH_TOKEN. Requires a
        # Trusted Publisher on npmjs (repo + this workflow file: nodejs-release.yml).
        run: npm publish --provenance --access public
        working-directory: packages/widget
