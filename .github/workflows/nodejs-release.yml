# =============================================================================
# Release & NPM Publish Workflow
# =============================================================================
# Self-hosted build/test (the reusable nodejs-build.yml can't be used: its
# pnpm/action-setup passes a `version`, which conflicts with the package.json
# `packageManager` field that Turborepo requires). Release + notifications
# still use the shared reusables; the npm publish (OIDC, workspace sub-package)
# and CDN/Pages deploys have no reusable and are custom (as in the Banner repo).
#
# semantic-release config: .github/config/release/semantic-release.json
# (pkgRoot: packages/widget, npmPublish: false) bumps + commits the widget
# package.json and cuts the vX.Y.Z tag; the publish-npm job below publishes
# TOKENLESS via OIDC Trusted Publishing (docs/npm-publishing.md). The first
# publish was a one-time local bootstrap (`pnpm publish:bootstrap`).
#
# The CDN deploy (deploy-cdn.yml) keys off THIS workflow completing.
# =============================================================================

name: 🚀 Release & NPM Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test-and-build:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6 # no version → reads packageManager

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Lint
        run: pnpm lint

      - name: 💅 Format check
        run: pnpm format:check

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🏗️ Build
        run: pnpm build

      - name: 🧪 Test
        run: pnpm test

  release:
    name: 📦 Create Semantic Release
    needs: [test-and-build]
    if: needs.test-and-build.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
      extra-plugins: '@semantic-release/npm'
    secrets: inherit

  publish-npm:
    name: 📤 Publish core to npm (OIDC)
    needs: release
    if: needs.release.outputs.release-created == 'true'
    # OIDC Trusted Publishing — tokenless. continue-on-error so an npm hiccup
    # never blocks the CDN deploy (which keys off this workflow's success).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔖 Sync released version
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: packages/widget

      - name: 🏗️ Build at released version
        run: pnpm --filter @bauer-group/accessibility-widget build

      - name: 📤 Publish @bauer-group/accessibility-widget
        # OIDC (id-token: write) authenticates — no NODE_AUTH_TOKEN. Requires a
        # Trusted Publisher on npmjs (repo + this workflow file: nodejs-release.yml).
        # No --provenance: npm provenance requires a PUBLIC source repo, and this
        # repo is private. Re-add --provenance if the repo is ever made public.
        run: npm publish --access public
        working-directory: packages/widget

  publish-github:
    name: 📤 Publish core to GitHub Packages
    needs: release
    if: needs.release.outputs.release-created == 'true'
    # Best-effort mirror so the package shows in the repo's Packages sidebar
    # (npm.pkg.github.com). Uses GITHUB_TOKEN (packages: write) — no OIDC.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔖 Sync released version
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: packages/widget

      - name: 🏗️ Build at released version
        run: pnpm --filter @bauer-group/accessibility-widget build

      - name: 📤 Publish to GitHub Packages
        # setup-node's registry-url (npm.pkg.github.com) routes the scoped
        # package here; publishConfig carries no registry so it doesn't override.
        run: npm publish --access public
        working-directory: packages/widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
