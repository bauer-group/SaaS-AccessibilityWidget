name: 📚 Deploy Pages (Demo & Docs)

# Publishes the interactive demo + integration guides to GitHub Pages on a
# custom domain (served at root, so the demo's absolute paths work). The site
# self-loads the widget from its own /accessibility-widget/ path — production
# delivery to the CDN happens from deploy-cdn.yml (R2), NOT here.

on:
  push:
    branches: [main]
    paths:
      - 'packages/widget/**'
      - 'apps/demo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build demo (also builds + bundles the widget)
        run: pnpm demo:build

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v6

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
