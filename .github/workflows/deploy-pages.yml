name: 📚 Deploy Pages (Demo & Docs)

# Publishes the interactive demo + integration guides to GitHub Pages on a
# custom domain (served at root, so the demo's absolute paths work). The site
# self-loads the widget from its own /accessibility-widget/ path — production
# delivery to the CDN happens from deploy-cdn.yml (R2), NOT here.

on:
  push:
    branches: [main]
    paths:
      - 'packages/widget/**'
      - 'apps/demo/**'
      - '.github/workflows/deploy-pages.yml'
  # Re-publish after every release: semantic-release bumps the widget version and
  # the demo embeds + reports it, so the Pages site goes stale otherwise. The
  # release commit is pushed with GITHUB_TOKEN, which cannot re-trigger the push
  # event above, so we key off the Release run completing (same as deploy-cdn).
  workflow_run:
    workflows: ['🚀 Release & NPM Publish']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a workflow_run trigger, only publish when the Release actually
    # succeeded; push and manual runs are unconditional.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build demo (also builds + bundles the widget)
        run: pnpm demo:build

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v6

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
