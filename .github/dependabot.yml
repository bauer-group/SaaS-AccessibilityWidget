# Schedule: weekly on Sunday at 18:35 UTC - the auto-merge step of this
# repository (automation-templates docs/workflows/docker-maintenance.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '18:35'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # TypeScript 7.0 (native compiler) ships no JS API and typescript-eslint
      # refuses to load with it ("typescript-eslint does not support TS 7.0").
      # Re-enable once typescript-eslint supports TS >= 7.1, see
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '18:35'
      timezone: Etc/UTC
    commit-message:
      prefix: 'chore(ci)'
